version: v2
plugins:
  - remote: buf.build/protocolbuffers/go:v1.34.1
    out: gen/go
    opt: paths=source_relative
  - remote: buf.build/grpc/go:v1.3.0
    out: gen/go
    opt: paths=source_relative,require_unimplemented_servers=true
  - local: protoc-gen-es
    out: src/generated/nsfw
    opt:
      - target=ts
      - import_extension=js