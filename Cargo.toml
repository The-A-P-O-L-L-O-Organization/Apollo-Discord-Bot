[workspace]
resolver = "2"
members = [
    "crates/nsfw-proto",
    "crates/nsfw-server",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/apollo-bot/apollo-discord-bot"

[workspace.dependencies]
prost = { version = "0.12", features = ["derive"] }
tonic = { version = "0.10", features = ["transport", "tls"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
opentelemetry = { version = "0.27", features = ["trace", "metrics"] }
opentelemetry-otlp = { version = "0.27", features = ["http"] }
opentelemetry-sdk = { version = "0.27", features = ["trace", "metrics"] }
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
image = "0.25"
ndarray = "0.17"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
thiserror = "1"
num_cpus = "1"
ort = { version = "2.0.0-rc.13", features = ["download-binaries"] }