# Docker Compose for Apollo Discord Bot v2
# ── Single Instance (default) ─────────────────────────────────────────
#   docker compose up -d
#
# ── Multi-Instance (with profile) ─────────────────────────────────────
#   docker compose --profile multi up -d
#   Requires: DB_TYPE=postgres, DATABASE_URL, QUEUE_ENABLED=true, REDIS_HOST

services:
  # ── Single Instance ────────────────────────────────────────────────
  bot:
    image: ghcr.io/the-a-p-o-l-l-o-organization/apollo-discord-bot:latest
    container_name: apollo-discord-bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - bot-data:/app/bot
      - bot-logs:/app/logs
    healthcheck:
      test: ["CMD", "node", "-e", "process.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── Multi-Instance (postgres + redis + worker) ─────────────────────
  postgres:
    image: postgres:16-alpine
    profiles: [multi]
    restart: unless-stopped
    environment:
      POSTGRES_DB: apollo
      POSTGRES_USER: apollo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-apollo-dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apollo"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    profiles: [multi]
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-apollo-dev}
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  gateway:
    image: ghcr.io/the-a-p-o-l-l-o-organization/apollo-discord-bot:latest
    profiles: [multi]
    container_name: apollo-gateway
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_TYPE: postgres
      QUEUE_ENABLED: "true"
      RUN_MODE: gateway
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - bot-logs:/app/logs
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  worker:
    image: ghcr.io/the-a-p-o-l-l-o-organization/apollo-discord-bot:latest
    profiles: [multi]
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_TYPE: postgres
      QUEUE_ENABLED: "true"
      RUN_MODE: worker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - bot-logs:/app/logs
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  bot-data:
    driver: local
  bot-logs:
    driver: local
  postgres-data:
    driver: local
  redis-data:
    driver: local
