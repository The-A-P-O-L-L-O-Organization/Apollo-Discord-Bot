# Docker Compose for Apollo Discord Bot v2
# ── Single Instance (default) ─────────────────────────────────────────
#   docker compose up -d
#
# ── Multi-Instance (with profile) ─────────────────────────────────────
#   docker compose --profile multi up -d
#   Requires: DB_TYPE=postgres, DATABASE_URL, QUEUE_ENABLED=true, REDIS_HOST
#
# Note: The 'bot' service below can also run with postgres/redis by setting
# DB_TYPE=postgres, DATABASE_URL, QUEUE_ENABLED=true, REDIS_HOST in .env.
# When using postgres/redis, uncomment the depends_on section below.

services:
  # ── Single Instance ────────────────────────────────────────────────
  bot:
    image: ghcr.io/the-a-p-o-l-l-o-organization/apollo-discord-bot:latest
    container_name: apollo-discord-bot
    restart: on-failure:5
    env_file:
      - .env
    environment:
      - HEALTH_PORT=3000
      - HEALTH_HOST=0.0.0.0
    volumes:
      - bot-data:/app/src/data
      - bot-plugins:/app/data/plugins
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/healthz', (r) => { if (r.statusCode !== 200) process.exit(1) }).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    # Uncomment when using postgres/redis (DB_TYPE=postgres, QUEUE_ENABLED=true):
    # depends_on:
    #   postgres:
    #     condition: service_healthy
    #   redis:
    #     condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── Multi-Instance (postgres + redis + worker) ─────────────────────
  postgres:
    image: postgres:16-alpine
    profiles: [multi]
    restart: unless-stopped
    environment:
      POSTGRES_DB: apollo
      POSTGRES_USER: apollo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-apollo-dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apollo"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    profiles: [multi]
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-apollo-dev}
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  gateway:
    image: ghcr.io/the-a-p-o-l-l-o-organization/apollo-discord-bot:latest
    profiles: [multi]
    container_name: apollo-gateway
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_TYPE: postgres
      QUEUE_ENABLED: "true"
      RUN_MODE: gateway
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - bot-plugins:/app/data/plugins
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  worker:
    image: ghcr.io/the-a-p-o-l-l-o-organization/apollo-discord-bot:latest
    profiles: [multi]
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_TYPE: postgres
      QUEUE_ENABLED: "true"
      RUN_MODE: worker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - bot-plugins:/app/data/plugins
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  default:
    external: true
    name: apollo-interlink

volumes:
  bot-data:
    driver: local
  bot-plugins:
    driver: local
  postgres-data:
    driver: local
  redis-data:
    driver: local
