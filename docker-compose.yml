# Docker Compose for Apollo Discord Bot v2
# ── Single Instance (default) ─────────────────────────────────────────
#   docker compose up -d
#
# ── Multi-Instance (with profile) ─────────────────────────────────────
#   docker compose --profile multi up -d
#   Requires: DB_TYPE=postgres, DATABASE_URL, QUEUE_ENABLED=true, REDIS_HOST
#
# Note: The 'bot' service below can also run with postgres/redis by setting
# DB_TYPE=postgres, DATABASE_URL, QUEUE_ENABLED=true, REDIS_HOST in .env.
# When using postgres/redis, uncomment the depends_on section below.

services:
  # ── Single Instance ────────────────────────────────────────────────
  bot:
    image: ghcr.io/the-a-p-o-l-l-o-organization/apollo-discord-bot:latest
    container_name: apollo-discord-bot
    restart: on-failure:5
    command: ["node", "dist/index.js"]
    env_file:
      - .env
    environment:
      - HEALTH_PORT=3000
      - HEALTH_HOST=0.0.0.0
      - NODE_OPTIONS=--enable-source-maps
    volumes:
      - bot-data:/app/src/data
      - bot-plugins:/app/data/plugins
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/healthz', (r) => { if (r.statusCode !== 200) process.exit(1) }).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    # Uncomment when using postgres/redis (DB_TYPE=postgres, QUEUE_ENABLED=true):
    # depends_on:
    #   postgres:
    #     condition: service_healthy
    #   redis:
    #     condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── Multi-Instance (postgres + redis + worker) ─────────────────────
  postgres:
    image: postgres:16-alpine
    profiles: [multi]
    restart: unless-stopped
    environment:
      POSTGRES_DB: apollo
      POSTGRES_USER: apollo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-apollo-dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apollo"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    profiles: [multi]
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-apollo-dev}
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  gateway:
    image: ghcr.io/the-a-p-o-l-l-o-organization/apollo-discord-bot:latest
    profiles: [multi]
    container_name: apollo-gateway
    restart: unless-stopped
    command: ["node", "dist/index.js"]
    env_file:
      - .env
    environment:
      DB_TYPE: postgres
      QUEUE_ENABLED: "true"
      RUN_MODE: gateway
      NODE_OPTIONS: --enable-source-maps
      INTERLINK_GRPC_ADDR: http://interlink:50052
      INTERLINK_AUTH_KEY: ${INTERLINK_AUTH_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - bot-plugins:/app/data/plugins
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  worker:
    image: ghcr.io/the-a-p-o-l-l-o-organization/apollo-discord-bot:latest
    profiles: [multi]
    restart: unless-stopped
    command: ["node", "dist/worker.js"]
    env_file:
      - .env
    environment:
      DB_TYPE: postgres
      QUEUE_ENABLED: "true"
      RUN_MODE: worker
      NODE_OPTIONS: --enable-source-maps
      INTERLINK_GRPC_ADDR: http://interlink:50052
      INTERLINK_AUTH_KEY: ${INTERLINK_AUTH_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - bot-plugins:/app/data/plugins
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── NSFW Detection Worker ────────────────────────────────────────────
  nsfw-worker:
    build:
      context: .
      dockerfile: crates/nsfw-server/Dockerfile
      target: runtime
    image: apollo-nsfw-worker:latest
    profiles: [multi]
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NSFW_MODEL_PATH: /models/nsfw_model.onnx
      RUST_LOG: info
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://localhost:4318}
      NSFW_GRPC_ADDR: "[::]:50051"
      NSFW_THRESHOLD: "0.6"
    volumes:
      - ./models:/models:ro
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=localhost:50051"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── Interlink Bot-to-Bot RPC (Go ConnectRPC, h2c) ────────────────────
  interlink:
    build:
      context: services/interlink
      dockerfile: Dockerfile
    image: apollo-interlink:latest
    profiles: [multi]
    restart: unless-stopped
    environment:
      INTERLINK_GRPC_ADDR: "[::]:50052"
      INTERLINK_REDIS_URL: redis://:${REDIS_PASSWORD:-apollo-dev}@redis:6379
      INTERLINK_AUTH_KEY: ${INTERLINK_AUTH_KEY:-}
      INTERLINK_RATE_LIMIT: "100"
      INTERLINK_BURST: "200"
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      LOG_LEVEL: info
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    # No healthcheck: distroless runtime has no shell/wget, and
    # grpc_health_probe is inapplicable (server does not implement
    # grpc.health.v1.Health; it exposes plain HTTP /healthz instead).
    # Probe http://interlink:50052/healthz externally (orchestrator,
    # gateway liveness, or k8s httpGet probe).
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  default:
    external: true
    name: apollo-interlink

volumes:
  bot-data:
    driver: local
  bot-plugins:
    driver: local
  postgres-data:
    driver: local
  redis-data:
    driver: local
