# Docker Compose configuration for Apollo Discord Bot
# This is the recommended way to run the bot in production

services:
  bot:
    # Build the image from the Dockerfile
    build:
      context: .
      dockerfile: Dockerfile

    # Container name for easy identification
    container_name: apollo-discord-bot

    # Restart policy - restart container if it crashes or on system reboot
    restart: unless-stopped

    # Environment variables
    env_file:
      - .env

    # Persistent volumes for database and data
    volumes:
      - bot-data:/app/bot
      - bot-logs:/app/logs

    # Health check configuration
    healthcheck:
      test: ["CMD", "node", "-e", "process.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# Volume configuration for persistent data
volumes:
  bot-data:
    driver: local
  bot-logs:
    driver: local

