# Docker Compose configuration for Apollo Discord Bot
# This is the recommended way to run the bot in production

services:
  bot:
    # Build the image from the Dockerfile
    build:
      context: .
      dockerfile: Dockerfile

    # Container name for easy identification
    container_name: apollo-discord-bot

    # Restart policy - restart container if it crashes or on system reboot
    restart: unless-stopped

    # Environment variables
    environment:
      - NODE_ENV=production
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      - CLIENT_ID=${CLIENT_ID}
      - DASHBOARD_PORT=${DASHBOARD_PORT:-3001}
      - DASHBOARD_TOKEN=${DASHBOARD_TOKEN}
      - OWNER_IDS=${OWNER_IDS}

    # Volume mount for environment file
    env_file:
      - .env

    # Persistent volumes for database and data
    volumes:
      - bot-data:/app/bot
      - bot-logs:/app/logs

    # Expose dashboard port (optional - only if you want external access)
    ports:
      - "${DASHBOARD_PORT:-3001}:${DASHBOARD_PORT:-3001}"

    # Health check configuration
    healthcheck:
      test: ["CMD", "node", "-e", "process.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# Volume configuration for persistent data
volumes:
  bot-data:
    driver: local
  bot-logs:
    driver: local

