name: Protobuf Cross-Runtime Contract Check

on:
  push:
    branches: [main, develop, experimental]
    paths:
      - 'protos/**'
      - 'buf.yaml'
      - 'buf.gen*.yaml'
  pull_request:
    branches: [main, develop, experimental]
    paths:
      - 'protos/**'
      - 'buf.yaml'
      - 'buf.gen*.yaml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: write

env:
  NODE_VERSION: "26"
  PNPM_VERSION: "11"
  GO_VERSION_FILE: "services/interlink/go.mod"
  RUST_VERSION: "1.88"

jobs:
  setup:
    name: Setup
    runs-on: ubuntu-latest
    outputs:
      cache-key: ${{ steps.cache-key.outputs.key }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@ae0d4ed08881f17d1511386f5be3e62356acd4a6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Generate cache key
        id: cache-key
        run: echo "key=${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}" >> $GITHUB_OUTPUT

      - name: Restore dependencies cache
        id: cache-restore
        uses: actions/cache@3edfce9056124e459a23f683a21433670d47daca
        with:
          path: |
            node_modules
            **/node_modules
            ~/.pnpm-store
          key: ${{ steps.cache-key.outputs.key }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        if: steps.cache-restore.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile

      - name: Save dependencies cache
        if: steps.cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@3edfce9056124e459a23f683a21433670d47daca
        with:
          path: |
            node_modules
            **/node_modules
            ~/.pnpm-store
          key: ${{ steps.cache-key.outputs.key }}

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: actions/cache@3edfce9056124e459a23f683a21433670d47daca
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install buf
        run: |
          BUF_VERSION="v1.50.0"
          sudo curl -sSL -o /usr/local/bin/buf "https://github.com/bufbuild/buf/releases/download/${BUF_VERSION}/buf-Linux-x86_64"
          sudo chmod +x /usr/local/bin/buf
          buf --version

      - name: Install protobuf-compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

  generate-ts:
    name: Generate TypeScript
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Checkout repository
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@ae0d4ed08881f17d1511386f5be3e62356acd4a6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore dependencies cache
        uses: actions/cache@3edfce9056124e459a23f683a21433670d47daca
        with:
          path: |
            node_modules
            **/node_modules
            ~/.pnpm-store
          key: ${{ needs.setup.outputs.cache-key }}

      - name: Generate TypeScript protobuf code (interlink + nsfw)
        run: buf generate --template buf.gen.ts.yaml

      - name: Verify TypeScript compiles
        run: pnpm tsc --noEmit -p tsconfig.generated.json

      - name: Upload TS generated code
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ts-generated
          path: src/generated/
          retention-days: 7

  generate-go:
    name: Generate Go
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Checkout repository
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a

      - name: Set up Go
        uses: actions/setup-go@0c52d547c9bc32b1aa3301fd7a9cb496313a4491
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache: true

      - name: Install buf
        run: |
          BUF_VERSION="v1.50.0"
          sudo curl -sSL -o /usr/local/bin/buf "https://github.com/bufbuild/buf/releases/download/${BUF_VERSION}/buf-Linux-x86_64"
          sudo chmod +x /usr/local/bin/buf
          buf --version

      - name: Generate Go protobuf code (interlink)
        run: buf generate --template buf.gen.go.yaml

      - name: Verify Go compiles
        run: go build ./...
        working-directory: services/interlink

      - name: Upload Go generated code
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: go-generated
          path: gen/go/
          retention-days: 7

  generate-rust:
    name: Generate Rust (NSFW)
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Checkout repository
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: actions/cache@3edfce9056124e459a23f683a21433670d47daca
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install buf
        run: |
          BUF_VERSION="v1.50.0"
          sudo curl -sSL -o /usr/local/bin/buf "https://github.com/bufbuild/buf/releases/download/${BUF_VERSION}/buf-Linux-x86_64"
          sudo chmod +x /usr/local/bin/buf
          buf --version

      - name: Install protobuf-compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Generate Rust protobuf code (nsfw)
        run: buf generate --template buf.gen.yaml

      - name: Verify Rust compiles
        run: cargo build --workspace --exclude nsfw-server
        working-directory: .

      - name: Upload Rust generated code
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rust-generated
          path: gen/rust/
          retention-days: 7

  breaking-change-check:
    name: Breaking Change Detection
    runs-on: ubuntu-latest
    needs: [generate-ts, generate-go, generate-rust]
    steps:
      - name: Checkout repository
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          fetch-depth: 0  # Need full history for breaking change detection

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@ae0d4ed08881f17d1511386f5be3e62356acd4a6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install buf
        run: |
          BUF_VERSION="v1.50.0"
          sudo curl -sSL -o /usr/local/bin/buf "https://github.com/bufbuild/buf/releases/download/${BUF_VERSION}/buf-Linux-x86_64"
          sudo chmod +x /usr/local/bin/buf
          buf --version

      - name: Run buf breaking against main branch
        run: buf breaking --against '.git#branch=main'

  cross-runtime-verify:
    name: Cross-Runtime Interface Verification
    runs-on: ubuntu-latest
    needs: [generate-ts, generate-go, generate-rust]
    steps:
      - name: Checkout repository
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a

      - name: Download TS generated artifacts
        uses: actions/download-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ts-generated
          path: ts-generated

      - name: Download Go generated artifacts
        uses: actions/download-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: go-generated
          path: go-generated

      - name: Download Rust generated artifacts
        uses: actions/download-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rust-generated
          path: rust-generated

      - name: Verify interlink service definitions match
        run: |
          # Check that interlink service definitions are consistent
          echo "Checking interlink service definitions..."
          echo "TS interlink files:"
          find ts-generated/src/generated/interlink -name "*.ts" -type f | head -20
          echo "Go interlink files:"
          find go-generated/gen/go -name "*.go" -type f | head -20

      - name: Verify nsfw service definitions match
        run: |
          # Check that nsfw service definitions are consistent
          echo "Checking nsfw service definitions..."
          echo "TS nsfw files:"
          find ts-generated/src/generated/nsfw -name "*.ts" -type f | head -20
          echo "Rust nsfw files:"
          find rust-generated/gen/rust -name "*.rs" -type f | head -20

      - name: Validate no drift
        run: |
          # This step can be expanded with more sophisticated drift detection
          # For now, we ensure all generations succeeded
          echo "All three runtimes generated successfully - no build-time drift detected"