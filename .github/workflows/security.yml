name: Security

on:
  push:
    branches: [main, develop, experimental]
  pull_request:
    branches: [main, develop, experimental]
  schedule:
    - cron: "0 6 * * 1"  # Every Monday at 6 AM UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  actions: read
  pull-requests: write

env:
  NODE_VERSION: "26"
  PNPM_VERSION: "11"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE26: true

jobs:
  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run pnpm audit
        run: pnpm audit --audit-level=moderate || true

      - name: Generate audit report
        run: |
          echo "## Dependency Audit Report" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          pnpm audit --json > audit.json || true
          if [ -f audit.json ]; then
            ADVISORIES=$(cat audit.json | jq '.advisories | length // 0')
            echo "**Total advisories:** $ADVISORIES" >> "$GITHUB_STEP_SUMMARY"
          fi

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout repository
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a

      - name: Dependency Review
        uses: actions/dependency-review-action@907a6e9569212033966bc0b69d32473b046dd66b
        with:
          fail-on-severity: high
          deny-licenses: GPL-3.0, AGPL-3.0
          comment-summary-in-pr: always

  secrets-scan:
    name: Secrets Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          fetch-depth: 0

      - name: TruffleHog secrets scan
        uses: trufflesecurity/trufflehog@f8221ca52ac51bf66228d6ec3691f3ea0782ae15
        with:
          extra_args: --only-verified

  osv-scanner:
    name: OSV Scanner
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a

      - name: Run OSV Scanner
        id: osv-scan
        uses: google/osv-scanner-action/osv-scanner-action@9a96bc4d2b09685b6142bcfe25a3dc17cb2d7347
        continue-on-error: true
        with:
          scan-args: |-
            --lockfile=pnpm-lock.yaml
            --format=sarif
            --output=osv-results.sarif

      - name: Validate SARIF file
        id: validate
        run: |
          if [ -f "osv-results.sarif" ] && [ -s "osv-results.sarif" ]; then
            # Check if it's valid JSON and has the required SARIF structure
            if jq -e '.version and .runs' osv-results.sarif > /dev/null 2>&1; then
              echo "valid=true" >> "$GITHUB_OUTPUT"
              echo "SARIF file is valid"
            else
              echo "valid=false" >> "$GITHUB_OUTPUT"
              echo "SARIF file exists but is not valid SARIF format"
            fi
          else
            echo "valid=false" >> "$GITHUB_OUTPUT"
            echo "SARIF file does not exist or is empty"
          fi

      - name: Upload OSV scan results
        if: steps.validate.outputs.valid == 'true'
        uses: github/codeql-action/upload-sarif@486fec2a3ea2626afcd8c7e9208b4f515078dd7e
        with:
          sarif_file: osv-results.sarif
          category: osv-scanner

  trivy:
    name: Trivy Vulnerability Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8  # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'
          vuln-type: 'os,library'
          ignore-unfixed: false
          exit-code: '0'

      - name: Upload Trivy scan results to GitHub Security
        uses: github/codeql-action/upload-sarif@486fec2a3ea2626afcd8c7e9208b4f515078dd7e
        with:
          sarif_file: trivy-results.sarif
          category: trivy

  security-summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs: [dependency-audit, secrets-scan, osv-scanner, trivy]
    if: always()
    steps:
      - name: Generate summary
        run: |
          {
            echo "## Security Scan Summary"
            echo ""
            echo "| Check | Status |"
            echo "|-------|--------|"
            echo "| Dependency Audit | ${{ needs.dependency-audit.result == 'success' && '✅' || '❌' }} |"
            echo "| Secrets Scan | ${{ needs.secrets-scan.result == 'success' && '✅' || '❌' }} |"
            echo "| OSV Scanner | ${{ needs.osv-scanner.result == 'success' && '✅' || '❌' }} |"
            echo "| Trivy Scan | ${{ needs.trivy.result == 'success' && '✅' || '❌' }} |"
            echo ""
            echo "_Note: CodeQL analysis runs via GitHub's default setup._"
          } >> "$GITHUB_STEP_SUMMARY"
