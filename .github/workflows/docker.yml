name: Docker

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.npmrc'
      - 'src/**'
      - 'bin/**'
      - 'scripts/deploy-commands.ts'
      - 'plugin-manifest.json'
      - 'Dockerfile'
      - 'Dockerfile.prod'
      - '.dockerignore'
      - '.github/workflows/docker.yml'
      - 'services/interlink/**'
      - 'tsconfig.json'
      - 'tsconfig.build.json'
      - 'buf.yaml'
      - 'buf.gen.yaml'
      - 'buf.gen.ts.yaml'
      - 'buf.gen.go.yaml'
      - 'protos/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**'
      - 'crates/nsfw-server/Dockerfile'
  pull_request:
    branches: [main]
    paths:
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.npmrc'
      - 'src/**'
      - 'bin/**'
      - 'scripts/deploy-commands.ts'
      - 'plugin-manifest.json'
      - 'Dockerfile'
      - 'Dockerfile.prod'
      - '.dockerignore'
      - '.github/workflows/docker.yml'
      - 'services/interlink/**'
      - 'tsconfig.json'
      - 'tsconfig.build.json'
      - 'buf.yaml'
      - 'buf.gen.yaml'
      - 'buf.gen.ts.yaml'
      - 'buf.gen.go.yaml'
      - 'protos/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**'
      - 'crates/nsfw-server/Dockerfile'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  security-events: write
  id-token: write
  attestations: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE26: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image: ${{ steps.image.outputs.name }}
      tags: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase image name
        id: image
        run: echo "name=$(echo ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }} | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@8e671d84a3bd81afdfc4fdbb96a42b07c2a80934
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref_name == 'main' }}
            type=raw,value=experimental,enable=${{ github.ref_name == 'experimental' }}
            type=ref,event=pr
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: ./Dockerfile.prod
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=bot
          cache-to: type=gha,mode=max,scope=bot
          build-args: |
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VCS_REF=${{ github.sha }}
            VERSION=${{ github.ref_name }}

      - name: Scan bot image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ${{ github.event_name == 'push' && format('{0}@{1}', steps.image.outputs.name, steps.build.outputs.digest) || format('{0}:{1}', steps.image.outputs.name, steps.meta.outputs.version) }}
          format: sarif
          output: bot-trivy.sarif
          version: 'v0.75.0'

      - name: Upload bot SARIF results
        uses: github/codeql-action/upload-sarif@486fec2a3ea2626afcd8c7e9208b4f515078dd7e
        with:
          sarif_file: bot-trivy.sarif
          category: trivy-bot

      - name: Export build digest
        run: |
          {
            echo "## Docker Build Summary"
            echo ""
            echo "**Image:** \`${{ steps.image.outputs.name }}\`"
            echo "**Digest:** \`${{ steps.build.outputs.digest }}\`"
            echo "**Tags:**"
            echo "\`\`\`"
            echo "${{ steps.meta.outputs.tags }}"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"

  build-interlink:
    name: Build Interlink
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image: ${{ steps.image.outputs.name }}
      tags: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase image name
        id: image
        run: echo "name=$(echo ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-interlink | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@8e671d84a3bd81afdfc4fdbb96a42b07c2a80934
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref_name == 'main' }}
            type=raw,value=experimental,enable=${{ github.ref_name == 'experimental' }}
            type=ref,event=pr
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Build and push interlink image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: ./services/interlink
          file: ./services/interlink/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=interlink
          cache-to: type=gha,mode=max,scope=interlink

      - name: Scan interlink image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ${{ github.event_name == 'push' && format('{0}@{1}', steps.image.outputs.name, steps.build.outputs.digest) || format('{0}:{1}', steps.image.outputs.name, steps.meta.outputs.version) }}
          format: sarif
          output: interlink-trivy.sarif
          version: 'v0.75.0'

      - name: Upload interlink SARIF results
        uses: github/codeql-action/upload-sarif@486fec2a3ea2626afcd8c7e9208b4f515078dd7e
        with:
          sarif_file: interlink-trivy.sarif
          category: trivy-interlink

      - name: Export build digest
        run: |
          {
            echo "## Interlink Docker Build Summary"
            echo ""
            echo "**Image:** \`${{ steps.image.outputs.name }}\`"
            echo "**Digest:** \`${{ steps.build.outputs.digest }}\`"
            echo "**Tags:**"
            echo "\`\`\`"
            echo "${{ steps.meta.outputs.tags }}"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"

  build-nsfw:
    name: Build NSFW
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image: ${{ steps.image.outputs.name }}
      tags: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase image name
        id: image
        run: echo "name=$(echo ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-nsfw | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@8e671d84a3bd81afdfc4fdbb96a42b07c2a80934
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref_name == 'main' }}
            type=raw,value=experimental,enable=${{ github.ref_name == 'experimental' }}
            type=ref,event=pr
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Build and push nsfw image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: ./crates/nsfw-server/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=nsfw
          cache-to: type=gha,mode=max,scope=nsfw

      - name: Scan nsfw image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ${{ github.event_name == 'push' && format('{0}@{1}', steps.image.outputs.name, steps.build.outputs.digest) || format('{0}:{1}', steps.image.outputs.name, steps.meta.outputs.version) }}
          format: sarif
          output: nsfw-trivy.sarif
          version: 'v0.75.0'

      - name: Upload nsfw SARIF results
        uses: github/codeql-action/upload-sarif@486fec2a3ea2626afcd8c7e9208b4f515078dd7e
        with:
          sarif_file: nsfw-trivy.sarif
          category: trivy-nsfw

      - name: Export build digest
        run: |
          {
            echo "## NSFW Docker Build Summary"
            echo ""
            echo "**Image:** \`${{ steps.image.outputs.name }}\`"
            echo "**Digest:** \`${{ steps.build.outputs.digest }}\`"
            echo "**Tags:**"
            echo "\`\`\`"
            echo "${{ steps.meta.outputs.tags }}"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"

