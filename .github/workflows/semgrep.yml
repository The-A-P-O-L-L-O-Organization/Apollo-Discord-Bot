name: Security Scan (Semgrep)

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 3 * * 1'  # Weekly on Monday 3 AM UTC

jobs:
  semgrep:
    name: Semgrep Security Scan
    runs-on: ubuntu-latest
    container:
      image: returntocorp/semgrep:latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Install jq
        run: apk add --no-cache jq

      - name: Run Semgrep (SARIF output)
        run: semgrep scan --config=.github/semgrep-rules.yml --sarif --output=semgrep-results.sarif || true

      - name: Upload Semgrep results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: always()
        with:
          name: semgrep-results
          path: semgrep-results.sarif
          retention-days: 30

      - name: Fail on high severity findings
        run: |
          if [ -f semgrep-results.sarif ]; then
            HIGH_COUNT=$(jq '[.runs[0].results[] | select(.level == "error")] | length' semgrep-results.sarif)
            if [ "$HIGH_COUNT" -gt 0 ]; then
              echo "Found $HIGH_COUNT ERROR severity findings"
              jq '.runs[0].results[] | select(.level == "error") | {file: .locations[0].physicalLocation.artifactLocation.uri, line: .locations[0].physicalLocation.region.startLine, rule: .ruleId, message: .message.text}' semgrep-results.sarif
              exit 1
            fi
          fi
        shell: bash