name: Setup

on:
  workflow_call:
    inputs:
      node-version:
        description: Node.js version to use
        type: string
        default: "26"
      pnpm-version:
        description: pnpm version to use
        type: string
        default: "9"
      install-dependencies:
        description: Whether to install dependencies
        type: boolean
        default: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE26: true

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
        with:
          version: ${{ inputs.pnpm-version }}

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ inputs.node-version }}
          cache: pnpm

      - name: Get pnpm store directory
        if: ${{ inputs.install-dependencies }}
        id: pnpm-cache
        shell: bash
        run: echo "store=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm cache
        if: ${{ inputs.install-dependencies }}
        uses: actions/cache@3edfce9056124e459a23f683a21433670d47daca
        with:
          path: ${{ steps.pnpm-cache.outputs.store }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        if: ${{ inputs.install-dependencies }}
        run: pnpm install --frozen-lockfile

      - name: Cache node_modules
        if: ${{ inputs.install-dependencies }}
        uses: actions/cache@3edfce9056124e459a23f683a21433670d47daca
        with:
          path: |
            node_modules
            **/node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/pnpm-lock.yaml') }}
