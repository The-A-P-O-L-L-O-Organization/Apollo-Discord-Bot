name: Bug report
description: Report unexpected behavior, errors, or regressions
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug. Please fill out every section so triage can reproduce the issue quickly.

        Do not include tokens, secrets, raw `.env` values, database contents, or unredacted logs. Redact URLs, IDs, and error dumps before submitting.

        Security vulnerabilities must not be reported here. See the [security policy](../../SECURITY.md) for private disclosure instructions.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear summary of the unexpected behavior, including expected versus actual behavior.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Exact commands, slash command names, or events needed to reproduce. Include what happened at each step.
      placeholder: |
        1. Start the bot with `RUN_MODE=worker pnpm dev:worker`
        2. Run `/ban reason:test`
        3. Observe the failure reply
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Redacted structured log output, Discord error replies, or stack traces. Remove any secrets, guild names, and user identifiers.
      render: shell

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Deployment details that affect reproduction. Check `NODE_ENV`, `RUN_MODE`, and `DB_TYPE` values from your startup logs.
      placeholder: |
        - Node.js version: 26
        - Runtime mode (`RUN_MODE`): gateway
        - Database (`DB_TYPE`): postgres
        - Queue enabled with Redis: yes
        - Deployment: Docker Compose / bare metal
    validations:
      required: true

  - type: dropdown
    id: version
    attributes:
      label: Version or commit
      description: The release tag or commit hash the issue was observed on.
      options:
        - latest main
        - latest release
        - older version
    validations:
      required: true

  - type: checkboxes
    id: area
    attributes:
      label: Affected areas
      description: Select every area that applies.
      options:
        - label: Plugin or command behavior
        - label: Queue, worker, or scheduler
        - label: Gateway or leader election
        - label: Database or migrations
        - label: i18n or locales
        - label: Protobuf, interlink, or NSFW service
        - label: Docker, Compose, or CI
        - label: Documentation or codemaps

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Configuration notes, related issues, screenshots, or workaround attempts. Do not paste secrets or runtime data.

  - type: checkboxes
    id: checklist
    attributes:
      label: Pre-submission checklist
      options:
        - label: I searched existing issues for duplicates or related reports
          required: true
        - label: The issue reproduces on the latest main or release
          required: true
        - label: I removed secrets, tokens, and unredacted logs from this report
          required: true
